<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icono-180.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- viewport-fit=cover: para que la barra de abajo respete la zona del
         gesto de inicio en los iPhone sin botón. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f7f7f5" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0f0f10" media="(prefers-color-scheme: dark)" />
    <!-- Añadida a la pantalla de inicio se abre sin barras de navegador,
         como una app. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Parte del día" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>Parte del día</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
